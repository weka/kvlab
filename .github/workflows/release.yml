name: release

# On every push to main: derive the next semver from Conventional Commits
# (feat: -> minor, fix: -> patch, BREAKING CHANGE/! -> major; see CLAUDE.md —
# semantic commits are mandatory in this repo), publish the image + Helm
# chart under that semver via the repo's own Dagger module (overriding the
# local content-hash v999.0.0-<sha12> scheme), and create a GitHub Release
# with install instructions.
#
# No release is cut when no feat/fix/breaking commits landed since the last
# tag (docs/chore/ci-only pushes are silent).

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — the tag action walks commits since the last tag

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # Replaced by the cache below. setup-go's own cache is keyed on go.sum
          # alone, so its build cache is whatever run first saved that key
          # (usually ci.yml's -race build) and never holds this job's
          # cross-compiled objects: every release compiled three targets cold.
          cache: false

      # Restored on every run, saved (under a new key) only by a release, so
      # each release starts from the previous release's build cache and only
      # recompiles what changed.
      - name: Restore Go caches
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: release-go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            release-go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            release-go-${{ runner.os }}-

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # One definition, so the release gate and local runs cannot drift.
      # Deliberately NOT `task verify`: that adds gofmt and -race, and a
      # formatting slip should not block a release. The pull-request gate in
      # ci.yml is where the stricter checks belong.
      - name: Test
        run: task test

      - name: Compute next semver from Conventional Commits
        id: semver
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false # no feat/fix/breaking since last tag -> no release
          tag_prefix: v
          # Compute only. The tag is created by the GitHub Release step, after both
          # publishes succeed, so a failed publish leaves no tag behind and the
          # next push to main retries the same version.
          dry_run: true

      - name: No release needed
        if: steps.semver.outputs.new_tag == ''
        run: echo "No feat/fix/BREAKING commits since ${{ steps.semver.outputs.previous_tag }} — skipping release."

      - name: Log in to quay.io
        if: steps.semver.outputs.new_tag != ''
        run: echo "${{ secrets.QUAY_PASSWORD }}" | docker login quay.io -u "${{ secrets.QUAY_USERNAME }}" --password-stdin

      - name: Install Dagger CLI
        if: steps.semver.outputs.new_tag != ''
        run: |
          cd /usr/local
          # Must match dagger.json's engineVersion. Older engines fail in two
          # different ways, both verified locally against this module: a v0.18.6
          # engine cannot serve the introspection query the Python SDK sends
          # ("Unknown argument includeDeprecated"), and a v0.19.10 engine cannot
          # unmarshal the buildkit messages the current dockerfile frontend
          # sends ("wrong wireType for field LinuxResources").
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=0.21.7 sh
          dagger version

      - name: Build release binaries
        if: steps.semver.outputs.new_tag != ''
        # linux amd64+arm64, macOS arm64 (Apple Silicon) only. The linux ones
        # are also what the images ship (`--binaries` below), so nothing is
        # compiled twice: dist/bin/kvlab_* with Dockerfile's flags for the
        # GitHub Release and the benchmark image, dist/bin/kvlab-router_* with
        # Dockerfile.router's for the router image (same compile, own link).
        # TestReleaseBinaryFlagsMatchDockerfiles keeps the flags in step.
        run: |
          set -euo pipefail
          VERSION="${{ steps.semver.outputs.new_tag }}"
          mkdir -p dist/bin
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}"
            out="dist/bin/kvlab_${GOOS}_${GOARCH}"
            CGO_ENABLED=0 go build -trimpath -o "${out}/kvlab" .
            tar -czf "dist/kvlab_${VERSION}_${GOOS}_${GOARCH}.tar.gz" -C "${out}" kvlab
            if [ "$GOOS" = linux ]; then
              CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "dist/bin/kvlab-router_${GOOS}_${GOARCH}/kvlab" .
            fi
          done
          ls -lh dist/*.tar.gz

      - name: Save Go caches
        if: steps.semver.outputs.new_tag != ''
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: release-go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

      # Two images and two charts from one commit under one semver. The
      # benchmark pair embeds the multi-GB replay artifact; the router pair does
      # not, because a router never reads it. Publishing both here is what keeps
      # them from drifting: a release either ships a matched set or fails.
      #
      # One `dagger call release` rather than push-helm then push-router-helm:
      # one engine start and module load, and the two pairs publish
      # concurrently. The benchmark image is grafted onto the replay image in
      # the registry, so the multi-GB replay layer is never downloaded here and
      # the runner needs no extra disk.
      - name: Publish benchmark + router images and charts under semver (dagger release)
        if: steps.semver.outputs.new_tag != ''
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          dagger call release \
            --source=. \
            --binaries=dist/bin \
            --helm-username=env://QUAY_USERNAME \
            --helm-password=env://QUAY_PASSWORD \
            --version "${{ steps.semver.outputs.new_tag }}"

      - name: Commit list for the release notes
        id: notes
        if: steps.semver.outputs.new_tag != ''
        # GitHub's generated notes list merged pull requests only; most changes
        # land as direct pushes, so the notes carry every commit since the
        # previous tag as well.
        env:
          PREV: ${{ steps.semver.outputs.previous_tag }}
        run: |
          if [ -n "$PREV" ] && git rev-parse -q --verify "refs/tags/$PREV" >/dev/null; then
            range="$PREV..HEAD"
          else
            range="HEAD"
          fi
          {
            echo 'commits<<KVLAB_NOTES_EOF'
            git log --no-merges --pretty='- %s (%h)' "$range"
            echo 'KVLAB_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.semver.outputs.new_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semver.outputs.new_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*.tar.gz
          body: |
            ## Changes since ${{ steps.semver.outputs.previous_tag }}

            ${{ steps.notes.outputs.commits }}

            ## Install

            Prebuilt binaries (linux amd64/arm64, macOS Apple Silicon) are
            attached below, e.g.:

            ```
            curl -fsSL https://github.com/weka/kvlab/releases/download/${{ steps.semver.outputs.new_tag }}/kvlab_${{ steps.semver.outputs.new_tag }}_$(uname -s | tr A-Z a-z)_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz | tar -xz
            ```

            ### Benchmark

            Replay benchmark against your endpoint (see chart README for all values).
            This image embeds the replay artifact, so no volume or fetch step is needed:

            ```
            helm upgrade --install my-replay oci://quay.io/weka.io/helm/kvlab \
              --version ${{ steps.semver.outputs.new_tag }} \
              --set endpoint=http://YOUR-LLM-HOST:8000
            ```

            ```
            docker pull quay.io/weka.io/kvlab:${{ steps.semver.outputs.new_tag }}
            ```

            ### Router

            Model-aware LLM router with prefix-cache affinity. Separate,
            replay-less image — same binary, without the multi-GB replay layer a
            router never reads.

            Point it at your fleet by pod label. Each discovered pod contributes
            its own port, so several DaemonSets on different ports stay one pool:

            ```
            helm upgrade --install my-router oci://quay.io/weka.io/helm/kvlab-router \
              --version ${{ steps.semver.outputs.new_tag }} \
              --set-string 'router.backends[0].pods.app=vllm' \
              --set-string 'router.backends[0].port=http'
            ```

            A static list works the same way, and the two can be mixed:

            ```
              --set-string 'router.backends[0]=http://vllm-a:8000' \
              --set-string 'router.backends[1]=http://vllm-b:8000'
            ```

            Per-model routes, a hosted fallback and credentials are in
            [docs/router.md](https://github.com/weka/kvlab/blob/main/docs/router.md).

            ```
            docker pull quay.io/weka.io/kvlab-router:${{ steps.semver.outputs.new_tag }}
            ```

            CLI (binary is named `kvlab`):

            ```
            go install github.com/weka/kvlab@${{ steps.semver.outputs.new_tag }}
            ```
